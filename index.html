<!doctype html>
<html lang="en" class="dark bg-[#0a0718] text-white overflow-x-clip">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IncomeZone - Earn & Post Micro-Jobs</title>
    <meta name="description" content="Micro-job marketplace to earn and post tasks." />
    <meta property="og:title" content="IncomeZone" />
    <meta property="og:description" content="Micro-job marketplace to earn and post tasks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html {
        font-size: 80%;
        width: 100%;
        min-height: 100%;
        overflow-x: clip;
        -webkit-overflow-scrolling: touch;
      }
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: clip;
      }
      html, body, #root {
        width: 100%;
        min-height: 100%;
        background-color: #0a0718;
        color: #ffffff;
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('iz_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0a0718] text-white min-h-screen overflow-x-clip antialiased">
    <div id="root" class="min-h-screen bg-[#0a0718]"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
